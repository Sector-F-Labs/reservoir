[book]
authors = ["Divan Visagie", "Reservoir Contributors"]
language = "en"
multilingual = false
src = "src"
title = "Sector F Labs - Reservoir"
description = "Your helpful memory for AI conversations - Documentation"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/divanvisagie/reservoir"
edit-url-template = "https://github.com/divanvisagie/reservoir/edit/main/book/{path}"
site-url = "/reservoir/"
copy-fonts = true
no-section-label = false
additional-assets = ["theme/logo.png"]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

