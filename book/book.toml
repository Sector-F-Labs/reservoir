[book]
authors = ["Divan Visagie", "Reservoir Contributors"]
language = "en"
multilingual = false
src = "src"
title = "Reservoir Documentation"
description = "Your helpful memory for AI conversations - Documentation"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
additional-css = ["theme/custom.css"]
additional-js = ["theme/custom.js"]
git-repository-url = "https://github.com/divanvisagie/reservoir"
edit-url-template = "https://github.com/divanvisagie/reservoir/edit/main/book/{path}"
site-url = "/reservoir/"
copy-fonts = true
no-section-label = false


[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true

[output.html.playground]
copyable = true
copy-js = true
line-numbers = false
editable = false
