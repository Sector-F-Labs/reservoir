[package]
name = "reservoir-admin-ui"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "egui graph view of Reservoir nodes, compiled to wasm and served by `reservoir admin`"
publish = false

# Built for wasm32 on its own, separate from the CLI crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
ehttp = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
